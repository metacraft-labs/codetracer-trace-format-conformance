name: Conformance

# Runs this repository's suite: every test that holds the Nim implementation
# of the CodeTracer trace format (codetracer-trace-format-nim) and the Rust one
# (codetracer-trace-format) against each other, including the genuine-producer
# entry gate on Linux and on native Windows.
#
# It runs in three places, so that a change to either implementation is held
# against the other before it lands:
#
#   * here, on a change to this repository, against both libraries;
#   * in codetracer-trace-format, whose `conformance.yml` calls this workflow
#     (`workflow_call`) for every change there;
#   * in codetracer-trace-format-nim, likewise.
#
# Under `workflow_call` the `github` context is the CALLER's, so
# `github.repository`/`github.sha` name the commit under test. Each job lays
# the three repositories out side by side, the layout every path in this
# suite assumes. The Linux job puts them under `trace-format-ws/`:
#
#   trace-format-ws/codetracer-trace-format
#   trace-format-ws/codetracer-trace-format-nim
#   trace-format-ws/codetracer-trace-format-conformance
#
# The Windows job puts them beside the runner's checkout root instead, for
# path length (see that job).
#
# The commit under test is checked out by `actions/checkout`, and it is
# setup-dev-env's consumer: setup-dev-env refuses a nested consumer whose HEAD
# is not `github.sha`, and resolves bare sibling names from the consumer's
# committed repro.lock. This repository (when it is not the commit under test)
# and the other library are siblings of the consumer, cloned by setup-dev-env.
# "Select siblings" says at which revisions. The suite itself always runs in
# this repository's checkout, with this repository's dev shell.

on:
  push:
    branches: [dev, stable]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: conformance-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: [self-hosted, linux, x64, ephemeral, incus]
    defaults:
      run:
        shell: bash
        working-directory: trace-format-ws/codetracer-trace-format-conformance
    steps:
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      # Which revision of each repository the suite runs with.
      #
      #   * The commit under test is checked out below at `github.sha`, and
      #     is setup-dev-env's consumer.
      #   * A sibling the caller's repro.lock pins is named bare, so it is
      #     taken at that pin: both libraries for this repository's own runs,
      #     and the Nim library for the Rust one, whose recipe depends on it.
      #   * Anything else is named at its agent landing branch, `agents`,
      #     where the changes that move together with the caller's land: this
      #     repository for both libraries, and the Rust library for the Nim
      #     one, which depends on neither of the others.
      - name: Select siblings
        id: siblings
        working-directory: .
        run: |
          set -euo pipefail
          case "${GITHUB_REPOSITORY}" in
            metacraft-labs/codetracer-trace-format-conformance)
              list="codetracer-trace-format codetracer-trace-format-nim" ;;
            metacraft-labs/codetracer-trace-format)
              list="codetracer-trace-format-nim codetracer-trace-format-conformance=agents" ;;
            metacraft-labs/codetracer-trace-format-nim)
              list="codetracer-trace-format=agents codetracer-trace-format-conformance=agents" ;;
            *)
              echo "::error::the conformance suite is not set up for ${GITHUB_REPOSITORY}"
              exit 1 ;;
          esac
          echo "list=${list}" >> "$GITHUB_OUTPUT"
          echo "under-test=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
          echo "consumer=trace-format-ws/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Checkout the commit under test
        uses: actions/checkout@v5
        with:
          path: trace-format-ws/${{ steps.siblings.outputs.under-test }}

      - name: Setup dev env
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          consumer-directory: ${{ steps.siblings.outputs.consumer }}
          workspace-directory: trace-format-ws
          gh-token: ${{ steps.app-token.outputs.token }}
          # The job outlives the App token's hour (PR #1 run 43558474940 took
          # 63 minutes). With the App's credentials setup-dev-env starts its
          # credential broker, which re-mints the Nix GitHub credential before
          # it expires, so a Nix fetch late in the suite is not refused with
          # `401 Bad credentials`.
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          app-private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          siblings: ${{ steps.siblings.outputs.list }}

      - name: Report the three checkouts
        run: |
          set -euo pipefail
          for repo in codetracer-trace-format codetracer-trace-format-nim codetracer-trace-format-conformance; do
            test -d "../${repo}/.git" || { echo "::error::${repo} is not checked out beside this repository"; exit 1; }
            echo "${repo}: $(git -C "../${repo}" rev-parse HEAD)"
          done

      # The entry gate admits only the Nim peer at the revision repro.lock
      # pins, and only a committed checkout of this repository. When this run
      # gates a library change, the lock cannot name it yet: pin the libraries
      # under test and commit that on the runner (never pushed).
      - name: Pin the libraries under test
        run: |
          set -euo pipefail
          python3 ci/pin-libraries-under-test.py
          if ! git diff --quiet; then
            git -c user.name=conformance-ci -c user.email=conformance-ci@localhost \
              commit -q -am "ci: pin the libraries under test"
          fi

      - name: Lint
        if: github.repository == 'metacraft-labs/codetracer-trace-format-conformance'
        run: nix develop --command just lint

      # GITHUB_TOKEN is for one request: the locked Nim peer's Nimble metadata
      # writer (nix/construct-runtime-metadata.nim) reads the official Nim
      # release list from api.github.com/repos/nim-lang/Nim/tags, a public
      # endpoint whose anonymous quota the shared runners exhaust. It is the
      # job's own token, valid until the job ends, not the App token: that
      # one expires an hour after "Generate CI token", and the writer runs
      # about an hour into the job. In PR #1 run 43558474940 it ran at
      # 05:51, two minutes after the 04:49 App token expired, got 401, and
      # the writer refused with exit 70 (genuine-nimble-two-metadata-writers).
      # The environment reaches the writer unchanged (the runtime constructor
      # passes the peer's activated shell environment), so the value set here
      # is the value it sends.
      - name: Conformance suite
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix develop --command just test

      - name: Retain the entry runtime receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-entry-runtime-linux
          path: trace-format-ws/codetracer-trace-format-conformance/.repro/build/entry-runtime/runtime/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  # The native coupled entry and sealed gate on Windows: the Nim producer and
  # the Rust producer built by native Windows toolchains, each reading the
  # other's images (tests/run_entry_coupled.py, Windows branch).
  #
  # Not run for codetracer-trace-format-nim's changes. setup-dev-env builds
  # its environment from its consumer, which must be the commit under test,
  # and the Nim library's recipe declares no Rust toolchain or Cap'n Proto
  # (it depends on no other implementation), so the Rust half of this gate
  # has nothing to build with there. The Linux job holds Nim changes against
  # the whole suite; the Rust library's changes, and this repository's, run
  # both jobs.
  #
  # Layout. Unlike the Linux job, this one keeps the commit under test at the
  # runner's own checkout root and its siblings beside it (setup-dev-env's
  # default layout, as codetracer-trace-format's Windows job had), because
  # Windows paths have a hard length limit and the Nim compiler that repro
  # runs on the consumer's recipe is not long-path aware. repro writes the
  # recipe's sibling shims to
  #
  #   <consumer>\.repro\dev-env\default\provider-work\home\tmp\repro-sibling-shims\
  #     c_<fnv32>_<last 30 path chars>\repro_sib_codetracer_trace_format_nim.nim
  #
  # which is the consumer root plus up to 67 + 43 + 42 characters. Under
  # `trace-format-ws\` the consumer root was 147 characters and the shim
  # directory 257, over CreateDirectory's 248 (PR #1 run 43550388329, "The
  # filename or extension is too long"). At the checkout root it is
  #
  #   C:\actions-runner\_work\codetracer-trace-format-conformance\codetracer-trace-format-conformance  (95)
  #   C:\actions-runner\_work\codetracer-trace-format\codetracer-trace-format                          (71)
  #
  # so the shim directory is at most 205 (limit 248) and the shim file 247
  # (limit 260) here, and 181 / 223 for the Rust library's runs. The runner
  # names the checkout root after the repository, which leaves nothing
  # shorter to choose. Every step runs in this suite's checkout,
  # `../codetracer-trace-format-conformance` from the checkout root (which,
  # for this repository's own runs, is the checkout root itself).
  windows:
    if: github.repository != 'metacraft-labs/codetracer-trace-format-nim'
    strategy:
      fail-fast: false
      matrix:
        runner: [eph-win-x64, eph-win-arm64]
    # The x64 ephemeral pool is paused; use the served Windows x64 class.
    runs-on: ${{ matrix.runner == 'eph-win-x64' && fromJSON('["self-hosted", "Windows", "X64", "dev-env-ready"]') || matrix.runner }}
    env:
      REPRO_TOOL_PROVISIONING: tarball
    defaults:
      run:
        working-directory: ../codetracer-trace-format-conformance
    steps:
      - name: Generate CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Select siblings
        id: siblings
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          case "${GITHUB_REPOSITORY}" in
            metacraft-labs/codetracer-trace-format-conformance)
              list="codetracer-trace-format codetracer-trace-format-nim" ;;
            metacraft-labs/codetracer-trace-format)
              list="codetracer-trace-format-nim" ;;
            *)
              echo "::error::the conformance suite is not set up for ${GITHUB_REPOSITORY}"
              exit 1 ;;
          esac
          echo "list=${list}" >> "$GITHUB_OUTPUT"

      - name: Checkout the commit under test
        uses: actions/checkout@v5

      # This suite at its agent landing branch, beside the commit under test,
      # cloned before the dev env because the CMake step below runs one of its
      # scripts. Not actions/checkout, which writes only inside the checkout
      # root. The token goes in through the environment, never into the
      # clone's configuration. A clone a previous job left there (the x64
      # class is persistent) is replaced, never reused.
      - name: Clone this suite
        if: github.repository != 'metacraft-labs/codetracer-trace-format-conformance'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ steps.ci_token.outputs.token }}
        run: |
          set -euo pipefail
          rm -rf ../codetracer-trace-format-conformance
          echo "::add-mask::$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/metacraft-labs/.extraHeader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            git clone --quiet --single-branch --branch agents \
              https://github.com/metacraft-labs/codetracer-trace-format-conformance \
              ../codetracer-trace-format-conformance
          echo "codetracer-trace-format-conformance: $(git -C ../codetracer-trace-format-conformance rev-parse HEAD)"

      - name: Provision pinned native CMake
        shell: pwsh
        run: |
          $architecture = switch ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()) {
            "Arm64" { "arm64" }
            "X64" { "x64" }
            default { throw "Unsupported native Windows CMake architecture." }
          }
          $destination = Join-Path $env:RUNNER_TEMP ("trace-capnp-cmake-" + [Guid]::NewGuid().ToString("N"))
          ./ci/ensure-native-cmake.ps1 -Architecture $architecture -Destination $destination

      - name: Setup dev env (reprobuild)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@26448a158691e2ce4858c10312618a306a333b8e
        with:
          env-flavor: reprobuild
          repro-version: v0.2.17
          gh-token: ${{ steps.ci_token.outputs.token }}
          siblings: ${{ steps.siblings.outputs.list }}

      - name: Verify the declared Cap'n Proto executable
        shell: bash
        run: dev-exec capnp --version

      # python.org's NuGet build at an exact pin, extracted under RUNNER_TEMP
      # (ci/provision-entry-python.ps1 says why not actions/setup-python).
      - name: Provision the declared native entry-gate Python
        id: entry_python
        shell: pwsh
        run: |
          $architecture = switch ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()) {
            "Arm64" { "arm64" }
            "X64" { "x64" }
            default { throw "Unsupported native Windows Python architecture." }
          }
          $destination = Join-Path $env:RUNNER_TEMP ("entry-python-" + [Guid]::NewGuid().ToString("N"))
          ./ci/provision-entry-python.ps1 -Architecture $architecture -Destination $destination

      - name: Pin the libraries under test
        shell: pwsh
        env:
          ENTRY_GATE_PYTHON: ${{ steps.entry_python.outputs.python-path }}
        run: |
          & $env:ENTRY_GATE_PYTHON -I -B ci/pin-libraries-under-test.py
          if ($LASTEXITCODE -ne 0) { throw 'pinning the libraries under test failed' }
          git diff --quiet
          if ($LASTEXITCODE -ne 0) {
            git -c user.name=conformance-ci -c user.email=conformance-ci@localhost commit -q -am "ci: pin the libraries under test"
            if ($LASTEXITCODE -ne 0) { throw 'committing the pin failed' }
          }

      # The native entry provider and gate admit the Nim supplier only if every
      # tracked file's bytes are its Git blob's (ci/native-entry-provider.py,
      # supplier_state; tests/run_entry_coupled.py). setup-dev-env's sibling
      # clone is a plain `git clone`, so it inherits Git for Windows' system
      # `core.autocrlf=true` and writes every LF text file with CRLF: "Supplier
      # physical source differs from declared Git body" (PR #1 run
      # 43558474940, eph-win-x64). The supplier has no .gitattributes, so
      # turning the conversion off is enough. `core.symlinks=false` writes its
      # one symlink (.github/copilot-instructions.md -> ../AGENTS.md) as a
      # file holding the target, which is the blob's bytes, whatever the
      # runner's own `core.symlinks` (Git for Windows writes a real symlink's
      # target with backslashes, which would not read back as the blob). The
      # same configuration is passed, per command and never into a config file
      # (the provider compares the supplier's configuration before and after),
      # to the two steps that read or clone Nim sources. A persistent runner
      # keeps its global Git configuration, which this leaves alone.
      - name: Check out the Nim supplier byte for byte
        shell: bash
        env:
          GIT_CONFIG_COUNT: "3"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
          GIT_CONFIG_KEY_2: core.symlinks
          GIT_CONFIG_VALUE_2: "false"
        run: |
          set -euo pipefail
          nim=../codetracer-trace-format-nim
          # A fresh clone with nothing of its own: rewriting it loses nothing.
          # Asked under the configuration the clone was made with (no command
          # overrides), under which its converted files are not changes.
          if [ -n "$(GIT_CONFIG_COUNT=0 git -C "$nim" status --porcelain)" ]; then
            echo "::error::the Nim supplier checkout has local changes"; exit 1
          fi
          # Remove every tracked file, then write them all again from HEAD
          # under the configuration above. (A `reset --hard` alone rewrites
          # nothing: the index says the converted files are up to date.)
          git -C "$nim" ls-files -z | (cd "$nim" && xargs -0 rm -f --)
          git -C "$nim" reset -q --hard HEAD
          # An early, readable check; the provider compares every byte. Only
          # CR line endings the blob lacks count (a symlink's index entry has no
          # line-ending class at all). awk prints the first five itself and
          # reads to the end: a `head` here could end the pipeline with
          # SIGPIPE, and under pipefail the step would fail without this
          # message.
          converted=$(git -C "$nim" ls-files --eol |
            awk '($2 == "w/crlf" || $2 == "w/mixed") && $1 != "i/" substr($2, 3) && n++ < 5')
          if [ -n "$converted" ]; then
            echo "::error::the Nim supplier still differs from its blobs in line endings:"
            echo "$converted"; exit 1
          fi
          echo "codetracer-trace-format-nim: $(git -C "$nim" rev-parse HEAD), byte-exact checkout"

      - name: Select the locked entry-gate Nim supplier
        id: entry_nim
        shell: pwsh
        env:
          ENTRY_GATE_PYTHON: ${{ steps.entry_python.outputs.python-path }}
        run: '& $env:ENTRY_GATE_PYTHON -I -B ci/select-entry-nim-supplier.py'

      # The sibling checkout is the supplier: after the pin step it is exactly
      # the revision the lock names, which native-entry-provider.py verifies.
      - name: Provision the declared native entry compiler and Zstd
        shell: pwsh
        env:
          ENTRY_GATE_PYTHON: ${{ steps.entry_python.outputs.python-path }}
          # Byte-exact Git checkouts (see "Check out the Nim supplier byte
          # for byte"), also for the dependency clones this step makes.
          GIT_CONFIG_COUNT: "3"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
          GIT_CONFIG_KEY_2: core.symlinks
          GIT_CONFIG_VALUE_2: "false"
        run: |
          & $env:ENTRY_GATE_PYTHON -I -B ci/native-entry-provider.py --output "$env:RUNNER_TEMP/entry-provider-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}" --nim-supplier ../codetracer-trace-format-nim --nim-revision "${{ steps.entry_nim.outputs.revision }}"

      - name: Provision the matching LLVM Rust target
        shell: pwsh
        env:
          ENTRY_GATE_PYTHON: ${{ steps.entry_python.outputs.python-path }}
        run: |
          $machine = & $env:ENTRY_GATE_PYTHON -I -B -c "import platform; print(platform.machine().upper())"
          if ($LASTEXITCODE -ne 0) { throw 'Declared native Python host probe failed' }
          $target = switch ($machine.Trim()) { 'ARM64' { 'aarch64-pc-windows-gnullvm' }; 'AMD64' { 'x86_64-pc-windows-gnullvm' }; default { throw 'Unsupported actual native host' } }
          rustup target add $target

      - name: Run the required native coupled entry and sealed gate
        shell: pwsh
        env:
          ENTRY_GATE_PYTHON: ${{ steps.entry_python.outputs.python-path }}
          # Byte-exact Git checkouts (see "Check out the Nim supplier byte
          # for byte"), as the provider saw the supplier and its dependency
          # clones.
          GIT_CONFIG_COUNT: "3"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
          GIT_CONFIG_KEY_2: core.symlinks
          GIT_CONFIG_VALUE_2: "false"
        run: |
          & $env:ENTRY_GATE_PYTHON -I -B tests/run_entry_coupled.py --work-root "$env:RUNNER_TEMP/entry-gate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}" --nim-environment-root ../codetracer-trace-format-nim --windows-provider "$env:RUNNER_TEMP/entry-provider-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}/frontend-component.json"

      - name: Preserve native entry-provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-entry-provider-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/entry-provider-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}/**/*.json
            ${{ runner.temp }}/entry-provider-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}/*.stdout
            ${{ runner.temp }}/entry-provider-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}/*.stderr
            ${{ runner.temp }}/entry-gate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}/nim-images/*.ct
            ${{ runner.temp }}/entry-gate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}/rust-images/*.ct
          if-no-files-found: error
